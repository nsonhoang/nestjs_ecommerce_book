
networks:
  my-networks:
    driver: bridge


volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nguyensonhoang/docker/volumes/mysql
      o: bind

  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nguyensonhoang/docker/volumes/redis
      o: bind

services:
 #nestjs

  nest-app:
    container_name: nestjs-app
    build: .
    hostname: nestjs
    restart: unless-stopped
    command: sh -c "npx prisma db push && node dist/src/main.js"
    networks: 
      - my-networks
    ports:
      - "3000:3000"
    volumes:
      - ./nestjs-ecommerce-book-firebase-adminsdk.json:/app/nestjs-ecommerce-book-firebase-adminsdk.json:ro
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:1@mysql:3306/e-commerce-book"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_HOST: mysql 
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GHN_TOKEN: ${GHN_TOKEN}
      GHN_BASE_URL: ${GHN_BASE_URL}
      GHN_SHOP_ID: ${GHN_SHOP_ID}


  

  # container redis
  redis:
    container_name: redis
    image: redis:8-alpine
    hostname: redis
    restart: unless-stopped
    networks:
      - my-networks
    volumes:
      - redis_data:/data
   
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    
  # mysql
  mysql:
    container_name: mysql
    image: mysql:8.4
    hostname: mysql
    networks:
      - my-networks
    restart: unless-stopped
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
   
  



  


    